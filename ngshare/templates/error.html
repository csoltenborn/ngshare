{% extends "base.html" %}

{% block title %}Error {{ status_code }} - JupyterHub{% end %}

{% block content %}
<div class="card" style="text-align: center; padding: 48px 24px; max-width: 600px; margin: 40px auto;">
    <h2 style="font-size: 2rem; color: #dc2626; margin-top: 0;">{{ status_code }}</h2>
    <h3 style="color: #1e293b; margin-top: 8px;">{{ error_title }}</h3>
    <p style="color: #64748b; margin: 12px 0 24px 0;">{{ error_message }}</p>
    <div>
        <a href="{{ prefix }}ui/classes" class="btn btn-primary" style="margin-right: 8px;">Go to Classes</a>
        <a href="/hub/home" class="btn btn-default">Hub Home</a>
    </div>
</div>
{% end %}
