<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}JupyterHub Management{% end %}</title>
    <link rel="stylesheet" href="/hub/static/css/style.min.css" type="text/css"/>
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .navbar-jh {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 24px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .navbar-brand {
            font-weight: 600;
            color: #0f172a !important;
        }
        .main-container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .card-header-title {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
        }
        .badge-active {
            background-color: #10b981;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .badge-disabled {
            background-color: #94a3b8;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .badge-token-set {
            background-color: #0284c7;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .badge-token-none {
            background-color: #cbd5e1;
            color: #475569;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .form-control[disabled], .form-control[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }
        .field-error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
        .field-hint {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .btn {
            display: inline-block;
            font-weight: 500;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid transparent;
            text-decoration: none;
        }
        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            color: #ffffff;
        }
        .btn-default {
            background-color: #ffffff;
            border-color: #cbd5e1;
            color: #334155;
        }
        .btn-default:hover {
            background-color: #f8fafc;
        }
        .btn-danger {
            background-color: #dc2626;
            color: #ffffff;
        }
        .btn-danger:hover {
            background-color: #b91c1c;
            color: #ffffff;
        }
        .btn-success {
            background-color: #16a34a;
            color: #ffffff;
        }
        .btn-success:hover {
            background-color: #15803d;
            color: #ffffff;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        .table th, .table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            vertical-align: middle;
        }
        .table th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .alert-success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-info {
            background-color: #f0f9ff;
            color: #075985;
            border: 1px solid #bae6fd;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-default navbar-jh">
        <div class="container-fluid" style="max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <span class="navbar-brand" style="padding: 0; font-size: 1.15rem;">JupyterHub</span>
                {% if is_admin %}
                <a href="{{ prefix }}ui/settings" style="color: #334155; font-weight: 500; text-decoration: none;">Settings</a>
                {% end %}
                <a href="{{ prefix }}ui/classes" style="color: #334155; font-weight: 500; text-decoration: none;">Classes</a>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span style="font-size: 0.9rem; color: #64748b;">User: <strong>{{ current_user_name }}</strong></span>
                <a href="/hub/home" class="btn btn-default" style="padding: 4px 10px; font-size: 0.85rem;">Hub Home</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div id="alert-box" style="display:none;"></div>
        {% block content %}{% end %}
    </div>

    <script>
        function showAlert(type, message) {
            const box = document.getElementById('alert-box');
            box.className = 'alert alert-' + type;
            box.innerHTML = message;
            box.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearAlert() {
            const box = document.getElementById('alert-box');
            box.style.display = 'none';
            box.innerHTML = '';
        }
    </script>
    {% block scripts %}{% end %}
</body>
</html>
